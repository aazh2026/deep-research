artifact_type: p3_claim_evidence_ledger
version: 1.0

claim_evidence_ledger:
  - claim_id: C-001
    claim_text: 应把学术严谨性评价拆成一组标准化输出件协同工作的 Prompt，而不是超长 Prompt
    position: "第一段"
    claim_type: normative
    supporting_evidence_ids: []  # 无经验证据（无对照实验）
    opposing_evidence_ids: []
    reasoning_rule: 工程经验 + 单职责原则的类比
    implicit_assumptions:
      - "复杂任务拆分优于单点处理"
      - "Subagent 间可通过工件可靠通信"
    evidence_sufficiency: insufficient
    reasoning_validity: partial
    scope_boundary: 学术严谨性评价任务
    status: partial
    judgment_basis: |
      拆分原则在软件工程中已被广泛验证（单职责原则、模块化）。
      但将软件工程原则外推到 LLM Prompt 设计，缺乏直接经验证据。
      文中未提供：单 Prompt 失败的案例、多 Prompt 成功的对照实验。

  - claim_id: C-002
    claim_text: 每个 Prompt 应只负责一个明确的研究任务，有独立输入、明确执行规则、结构化输出和质量门禁
    position: "第二段"
    claim_type: normative
    supporting_evidence_ids: []
    opposing_evidence_ids: []
    reasoning_rule: 接口隔离原则的类比
    implicit_assumptions:
      - "任务边界可被清晰划分"
      - "下游 prompt 不会被上游未声明的隐含信息影响"
    evidence_sufficiency: insufficient
    reasoning_validity: valid
    scope_boundary: 所有 P 任务
    status: partial
    judgment_basis: |
      原则正确（已被多 Agent 系统实践支持），但缺乏"为什么适用于 LLM Subagent"
      的具体论证。隐含假设"下游 prompt 不会被未声明信息影响"在 LLM 上下文中不一定成立
      （Subagent 仍可能从 article 上下文中提取出 P1 漏提取的内容）。

  - claim_id: C-003
    claim_text: 7 个 Prompt 覆盖学术严谨性评价的完整流程
    position: "第二节 一"
    claim_type: declarative
    supporting_evidence_ids: []
    opposing_evidence_ids: []
    reasoning_rule: 列举 + 主张
    implicit_assumptions:
      - "7 个任务已穷尽学术严谨性评价的关键环节"
      - "不存在被遗漏的环节"
    evidence_sufficiency: insufficient
    reasoning_validity: partial
    scope_boundary: 学术论文、技术研究报告、Agent 架构模式研究、工程方法论
    status: pending
    judgment_basis: |
      7 个任务的边界划分有内在逻辑（解析→多维审查→综合→修订闭环），但：
      1. 缺乏完备性论证——为什么是 7 而不是 6 或 8？
      2. 缺少对以下环节的处理：
         - 数据可获得性审查（falsifiability）
         - 利益冲突与作者资质
         - 复制研究（replication studies）
         - 性别/地区/学科偏差
      3. 7 个任务间的颗粒度不均——P5 单独占据反方挑战，是否应有 P2.5 文献补查、P6.5 同行预审？

  - claim_id: C-004
    claim_text: P2-P5 可在 P1 完成后并行执行
    position: "第二节末尾 + 第四节"
    claim_type: declarative
    supporting_evidence_ids: []
    opposing_evidence_ids: [E-INT-001]  # 内部矛盾
    reasoning_rule: 主张
    implicit_assumptions:
      - "P2、P3、P4 之间无信息依赖"
    evidence_sufficiency: insufficient
    reasoning_validity: invalid
    scope_boundary: P1 完成后
    status: refuted
    judgment_basis: |
      【内部矛盾】本文 P2-P4 各 prompt 的输入定义与"可并行"声称冲突：
      - P3 prompt 输入显式包含 P2_OUTPUT
      - P4 prompt 输入显式包含 P3_OUTPUT
      - P5 prompt 输入显式包含 P2/P3/P4_OUTPUT

      因此严格并行不可能。可能的解释：
      1. 作者意指"开始时间可早于 P2 完成"（错位并行，pipeline 模式）
      2. 各 prompt 实际可独立运行（但输入列表与文意不符）
      3. 内部矛盾

      建议将"并行"修改为"流水线式启动，P3 在 P2 后启动，P4 在 P3 后启动，
      P5 在 P4 后启动"。或在第四节明确"输入是可选占位，P3 启动时若 P2 未完成
      可先做不带 P2 的初稿，P2 完成后增量更新"。

  - claim_id: C-005
    claim_text: 无联网检索时相关 Prompt 只能标"待核实"或"无法验证"
    position: "边界说明段"
    claim_type: normative
    supporting_evidence_ids: []
    opposing_evidence_ids: []
    reasoning_rule: 边界条件声明
    implicit_assumptions:
      - "读者会接受这一边界"
    evidence_sufficiency: sufficient
    reasoning_validity: valid
    scope_boundary: 所有依赖外部信息的 P 任务
    status: supported
    judgment_basis: |
      这是诚实且合理的工程边界声明，符合作者立场。
      但未量化：当多少比例的 claim 标"待验证"时，整体 verdict 应该如何调整？

  - claim_id: C-006
    claim_text: 10 条公共规则是评价标准基线
    position: "第二节 二"
    claim_type: declarative
    supporting_evidence_ids: []
    opposing_evidence_ids: []
    reasoning_rule: 列举 + 断言
    implicit_assumptions:
      - "10 条已穷尽"
      - "10 条之间无矛盾"
    evidence_sufficiency: insufficient
    reasoning_validity: partial
    scope_boundary: 所有 P 任务
    status: partial
    judgment_basis: |
      10 条原则本身大多是合理的（如"不虚构证据""区分未验证与错误"）。
      问题：
      1. 缺乏完备性论证
      2. 第 5 条"主张与证据匹配"与第 9 条"评估结论边界"部分重叠
      3. 第 6 条"主动寻找反证"与 P5 任务边界存在职能重叠

  - claim_id: C-007
    claim_text: 5 类状态标签和 4 级缺陷等级应统一用于所有 P 任务
    position: "第二节 二"
    claim_type: declarative
    supporting_evidence_ids: []
    opposing_evidence_ids: []
    reasoning_rule: 接口标准化
    implicit_assumptions:
      - "5 类状态足够区分所有情况"
      - "P0-P3 等级阈值有共识"
    evidence_sufficiency: sufficient
    reasoning_validity: valid
    scope_boundary: 所有 P 任务
    status: partial
    judgment_basis: |
      状态标签和等级作为接口约定是合理的。
      但 P0 的判定标准"足以使核心结论失去成立基础"是循环定义——
      "核心结论"取决于"成立基础"的定义。建议补充 P0 判定的具体例子。

  - claim_id: C-008
    claim_text: P5 反方挑战应独立构造反方论证，不重复 P2-P4 的评价
    position: "P5 任务描述首段"
    claim_type: normative
    supporting_evidence_ids: []
    opposing_evidence_ids: []
    reasoning_rule: 任务边界设计
    implicit_assumptions:
      - "P5 具备独立发现问题的能力"
      - "P2-P4 可能漏掉关键问题"
    evidence_sufficiency: partial
    reasoning_validity: valid
    scope_boundary: P5 任务
    status: partial
    judgment_basis: |
      反方独立视角是优秀的设计。但"独立"的边界在文中不一致：
      - P5 prompt 强调"不得重复 P2-P4 评价"
      - 同时又说"应独立构造反方论证"
      - 但又允许"可选地参考 P2-P4 查漏"
      这三句同时成立时，"独立"与"参考"存在张力。

  - claim_id: C-009
    claim_text: P6 不能把 P2-P5 各维度分数简单求平均代替综合判断
    position: "P6 任务描述"
    claim_type: normative
    supporting_evidence_ids: []
    opposing_evidence_ids: []
    reasoning_rule: 工程经验
    implicit_assumptions:
      - "维度之间存在不可线性组合的关系"
    evidence_sufficiency: sufficient
    reasoning_validity: valid
    scope_boundary: P6 综合判断
    status: supported
    judgment_basis: |
      合理。但未给出"应该如何综合"的具体方法（如 Borda count、Delphi、加权求和？）
      给出"不要平均"是必要的，但"应该用什么"需要补充。

  - claim_id: C-010
    claim_text: 存在 P0 缺陷时，无论其他维度分数多高，verdict 必须降级
    position: "P6 任务描述强制约束"
    claim_type: normative
    supporting_evidence_ids: []
    opposing_evidence_ids: []
    reasoning_rule: 硬规则
    implicit_assumptions:
      - "P0 缺陷确实足以否定核心结论"
      - "verdict 是可枚举的离散量"
    evidence_sufficiency: sufficient
    reasoning_validity: valid
    scope_boundary: P6 verdict 生成
    status: supported
    judgment_basis: |
      设计正确，符合"硬规则优先级"原则。
      但 P0 的判定标准"足以使核心结论失去成立基础"较模糊，
      实际执行时仍依赖评审者主观判断。

  - claim_id: C-011
    claim_text: P6 的最终 verdict 必须是 6 种之一
    position: "P6 输出格式 F"
    claim_type: declarative
    supporting_evidence_ids: []
    opposing_evidence_ids: []
    reasoning_rule: 枚举
    implicit_assumptions:
      - "6 种 verdict 已穷尽所有合法结论"
    evidence_sufficiency: partial
    reasoning_validity: partial
    scope_boundary: P6 输出
    status: pending
    judgment_basis: |
      枚举式 verdict 简化了下游消费，但：
      1. "基本成立"与"部分成立"边界不清
      2. "尚未得到充分验证"与"证据不足"区分不明
      3. 缺少"有条件接受"（conditional acceptance）这种学术评审常用 verdict

  - claim_id: C-012
    claim_text: P7 修订后应根据修改影响范围触发相关 P 重跑
    position: "P7 Step 8"
    claim_type: declarative
    supporting_evidence_ids: []
    opposing_evidence_ids: []
    reasoning_rule: 增量更新
    implicit_assumptions:
      - "修改的影响范围可被准确判断"
    evidence_sufficiency: partial
    reasoning_validity: partial
    scope_boundary: P7 修订后
    status: partial
    judgment_basis: |
      增量重跑原则正确。但：
      1. 缺乏"影响范围"的判定算法
      2. 表中"核心结论被修改 → 必须重跑 P5 + P6"过于粗糙——P5 重跑成本高
      3. 缺少重跑后的对比方法（如何保证重跑后不引入新矛盾？）

logic_defects:
  - id: D-001
    related_claim_id: C-004
    defect_type: internal_inconsistency
    textual_evidence: |
      "这 7 个 Prompt 里，P2—P5 可以在 P1 完成后并行执行"
      与 P3 输入"待评价文章、P1_OUTPUT、P2_OUTPUT"、P4 输入"P1、P3_OUTPUT"、P5 输入"P1、P2、P3、P4"矛盾
    why_problematic: |
      "可并行执行"是核心架构声明（直接影响 skill 实现），但与各 prompt 的输入列表直接冲突。
      这是内部逻辑不一致。
    downstream_impact: |
      影响 skill 实现的并行策略。实现者要么选择"严格串行"（损失效率），
      要么选择"pipeline 式错位并行"（与原文表述不同），要么选择"输入是可选占位"（改变 prompt 含义）。
    severity: P1
    suggested_fix: |
      1. 明确并行模式（strict parallel / pipelined / placeholder-then-update）
      2. 或修改 P3/P4/P5 的输入列表，使其不依赖上游 P 输出
      3. 或在文中显式说"伪并行：P3 在 P2 启动后立即启动，使用 P2 占位"

  - id: D-002
    related_claim_id: C-003
    defect_type: unproven_premise
    textual_evidence: "针对学术论文、技术研究报告、Agent 架构模式研究和工程方法论，建议设计为 7 个 Prompt"
    why_problematic: |
      7 个任务的完备性未论证。文中未说明：
      1. 候选任务集合是什么
      2. 为什么从候选集合中选出 7 个
      3. 是否存在被遗漏的关键环节（如利益冲突、复制研究、性别/地区偏差）
    downstream_impact: |
      如果实际有遗漏的关键环节，整个工作流的严谨性受影响。
      例如：未审查"利益冲突"可能导致对工业资助论文的"客观性"误判。
    severity: P2
    suggested_fix: |
      1. 列出候选评价环节
      2. 论证从候选中选 7 的标准
      3. 显式声明被排除的环节及其理由

  - id: D-003
    related_claim_id: C-008
    defect_type: concept_swap
    textual_evidence: |
      P5 任务描述：
      - "P5 只能看 P1 + article，不得看 P2/P3/P4 的判断"
      - "可选地参考 P2–P4 查漏"
    why_problematic: |
      "不得看"与"可选地参考"逻辑上不兼容：
      如果 P5 不能看 P2-P4，那么"参考 P2-P4 查漏"就不可能。
      反之，如果允许参考，那么"不得看"的硬约束就不成立。
      "独立"与"参考"是程度问题，不是 0/1 问题，但文中把它当 0/1 描述。
    downstream_impact: |
      实现者无所适从。可能两种实现都"自圆其说"但实际效果不同。
    severity: P2
    suggested_fix: |
      明确 P5 的输入边界：
      - 阶段 1：仅看 P1 + article，独立推理
      - 阶段 2（可选）：参考 P2-P4 查漏，但不得改变阶段 1 的反方判断
      - 或：用"独立性分值"代替二元约束

  - id: D-004
    related_claim_id: C-011
    defect_type: unproven_premise
    textual_evidence: "采用以下结论之一：核心结论获得充分支持 / 核心结论基本成立..."
    why_problematic: |
      6 种 verdict 的边界未定义：
      1. "基本成立"和"部分成立"如何区分？都是"部分支持"但一个说"成立"一个说"不成立"？
      2. "尚未得到充分验证"和"证据不足"是同义还是不同？
    downstream_impact: |
      不同评审者对同一篇文章可能给出不同 verdict。
      例如：P3 给出 3 个 claim 待验证，P5 给出 2 个被反驳——
      这是"部分成立"还是"证据不足"？
    severity: P2
    suggested_fix: |
      为 6 种 verdict 各定义触发条件（claim 状态计数 + P0/P1 缺陷计数 + DIM 平均分阈值）

  - id: D-005
    related_claim_id: C-010
    defect_type: unproven_premise
    textual_evidence: "P0 致命：足以使核心结论失去成立基础"
    why_problematic: |
      "足以使核心结论失去成立基础"是循环定义。
      实际判定时缺乏可操作的判定规则。
    downstream_impact: |
      不同评审者对"这条缺陷是 P0 还是 P1"会有分歧。
    severity: P2
    suggested_fix: |
      给出 P0 判定的具体例子（"X 类缺陷在 Y 条件下为 P0"），
      或明确"两条独立 P1 缺陷累积为 P0"等规则

  - id: D-006
    related_claim_id: C-001
    defect_type: unproven_premise
    textual_evidence: "我建议把这套方法拆成一组能够通过标准化输出件协同工作的 Prompt"
    why_problematic: |
      "拆分优于单 Prompt"未提供任何经验证据或对照实验。
      属于规范性主张，但论证方式仅靠类比（软件工程模块化）。
    downstream_impact: |
      整个工作流的根基性主张缺乏直接证据。
    severity: P2
    suggested_fix: |
      至少补充 1-2 个案例：单 Prompt 失败的案例 vs 多 Prompt 成功的案例。
      或引用 LLM Multi-Agent 系统的相关研究作为依据。

  - id: D-007
    related_claim_id: C-006
    defect_type: overgeneralization
    textual_evidence: "10 条公共规则"
    why_problematic: |
      10 条规则之间存在部分重叠：
      - 规则 5"主张与证据匹配"与规则 9"评估结论边界"在评估结论范围上重叠
      - 规则 6"主动寻找反证"与 P5 任务职能重叠
    downstream_impact: |
      评审者在执行时可能不知道该按哪一条来评估。
    severity: P3
    suggested_fix: |
      合并或重新划分 10 条规则的边界，每条规则应有独立且不重叠的评估范围。

  - id: D-008
    related_claim_id: C-012
    defect_type: unproven_premise
    textual_evidence: "P7 修订之后不一定需要重跑所有任务，而应根据修改影响的主张和证据，重跑相关审查"
    why_problematic: |
      "影响范围"如何精确判断未给出算法。
      例如：修订中修改了 P3 引用的某条 E-002 证据，但 P5 也引用了 E-002，
      那么 P5 需要重跑吗？P3 重跑可能改变 P5 之前依赖的 D-NNN 状态。
    downstream_impact: |
      实际执行时 P7 的重跑集合可能过大（漏判）或不准确（错判）。
    severity: P2
    suggested_fix: |
      给出"影响范围"的判定算法：
      1. 列出被修改的 C-NNN/E-NNN
      2. 列出引用这些 ID 的所有 D-NNN/V-NNN
      3. 列出被这些 D-NNN 影响的所有下游 P 任务

  - id: D-009
    related_claim_id: C-009
    defect_type: selective
    textual_evidence: "不得以各子任务的评分简单求平均代替综合判断"
    why_problematic: |
      禁止了"平均"，但未说明"应该如何综合"。
      这是典型的"破而不立"——只说不能做什么，不说应该做什么。
    downstream_impact: |
      P6 实际执行时仍然会退化为某种隐式的"加权平均"或"取主导维度"。
    severity: P3
    suggested_fix: |
      给出综合判断的具体方法（如：Borda count、Delphi 法、规则化决策树）

conclusion_strength_review:
  - author_claim: "7-Prompt 工作流能有效完成学术严谨性评价"
    evidence_supported_claim: |
      7-Prompt 工作流作为方法论设计在结构上自洽（解析→多维审查→综合→修订闭环），
      且 P0 硬规则、P5 独立视角等设计符合工程经验。
    gap: |
      1. 缺乏经验验证（无案例、无对照）
      2. 缺乏完备性论证（7 的合理性）
      3. 内部存在 P1 缺陷（D-001 并行声明矛盾）
    suggested_more_cautious_wording: |
      "本文提出的 7-Prompt 工作流在结构设计层面自洽，但尚未经过实际论文评审验证。
      实际部署前应先在小规模（如 5-10 篇）真实论文上试用，
      并统计其与人类专家评审的一致性。"

