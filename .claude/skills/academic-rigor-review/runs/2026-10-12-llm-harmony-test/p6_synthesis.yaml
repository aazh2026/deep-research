    P4 报告 D-201 为 P0：方法学可复现性严重不足——模型/prompt/种子/运行次数均未报告，
    GitHub 仓库仅为 'simulation'。在此条件下，文章核心结论（C-001 多 agent 优于单 agent）
    失去成立基础。

    按 P0-R2 规则，verdict 强制降级为 5 或 6。本次选择 verdict 6（insufficient_evidence）
    而非 verdict 5（core_falsified），因为：
    1) 实验数据本身（C-004-006 65%/77%/83%）可能真实
    2) 核心结论（C-001）是否成立无法在当前证据下判断
