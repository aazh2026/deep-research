    description: |
      【P2-P4 未识别的关键问题】同质多 agent 的 collective delusion 风险。
      M3MAD-Bench 2025 显示同质多 agent 65% 失败属于 collective delusion。
      P3 提到 "inter-agent validation 减少幻觉" 但未考虑反向风险；
      P4 提到 construct validity 但未提 collective delusion；
      P2 提到 M3MAD-Bench 但只在 opposing views 中一笔带过。
    severity: P1
