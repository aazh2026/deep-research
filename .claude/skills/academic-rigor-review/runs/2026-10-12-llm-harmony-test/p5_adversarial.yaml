    textual_position: "Conclusion"
    description: |
      【P2-P4 未识别的关键问题】6× 推理成本与 fine-tuning 一次的对比未量化。
      P3 提到 cost-effective 主张无依据，
      但未具体指出同期文献给出的 6× 成本数据。
    severity: P2
