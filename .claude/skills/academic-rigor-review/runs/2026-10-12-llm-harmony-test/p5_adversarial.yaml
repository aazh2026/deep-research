# P5 Output: LLM Harmony 独立反方挑战
# Generated by: orchestrator (real paper test)
# Date: 2026-10-12
# 关键：本任务在 P1 后独立推理；P2-P4 的判断后续参考

artifact_type: p5_adversarial
version: 1.0

core_claim_challenges:
  - claim_id: C-001
    original_claim: "多 Agent + 角色扮演 + CoT 比单 Agent 表现更好"
    strongest_counter_argument: |
      提升完全可能来自"3 agents × N rounds"的更多推理 token，
      而非 multi-agent 架构本身。
      同期工作（Wang et al. 2023 "Self-Consistency"）显示：
      单 agent + k-sample majority vote 在 GSM8K 上可达 ~80%，
      计算成本仅为多 agent 的一小部分。
      Pham et al. 2024 ("More Agents Is All You Need") 用 Llama2-13B
      多个 agent ensemble (59%) 已超过单 Llama2-70B (54%)。
      这强烈提示：本文 50%→65% 提升可能是"更多采样"效应，
      而非"多 agent + persona"架构效应。
    counter_evidence_id: E-P5-001
    key_assumption_under_attack: "提升是 multi-agent 架构本身带来的，不是更多推理带来的"
    possible_counterexample: |
      单 agent + self-consistency (k=5) 在 GSM8K 上可达 78-82%
      (Wang et al. 2023)，与本文 65% 接近。
    challenge_strength: major
    could_change_conclusion: yes

  - claim_id: C-002
    original_claim: "相比已有 Multi-Agent 基线（55%/73%/78%）有进一步提升"
    strongest_counter_argument: |
      baseline 55% 的来源不明。CAMEL 实际 GSM8K 表现：
      - CAMEL-13B-Role-Playing-Data: 7.35%
      - CAMEL-13B-Combined-Data: 7.13%
      - 原文 ensemble method: 88.6%
      55% 介于 CAMEL fine-tuned 和 ensemble 之间，
      提示 baseline 可能是混合配置或自行实现。
      缺乏 baseline 实施细节使得整张表格无法解读。
    counter_evidence_id: E-P5-002
    key_assumption_under_attack: "Multi-Agent baseline 实施与原文一致"
    possible_counterexample: |
      如果 baseline 实际是 single-agent + CoT（误标为 multi-agent），
      那么"65% vs 55%"其实是 single-agent vs multi-agent 提升。
    challenge_strength: fatal
    could_change_conclusion: yes

  - claim_id: C-003
    original_claim: "inter-agent validation 减少幻觉"
    strongest_counter_argument: |
      反向证据：M3MAD-Bench (2025) 报告 100 例多 agent 失败中
      65% 属于 "collective delusion"——agents 互相强化错误答案。
      另一个现象 "incorrect conformity"：看到错误 peer 后，
      正确答案会主动放弃。
      本文使用同质多 agent（同一 LLM 多个 persona），
      正是 collective delusion 高风险配置。
      同期 Du et al. 2023 报告"ChatGPT + Bard debating 17/20"
      提示异质模型才有提升；同质模型可能反而放大偏差。
    counter_evidence_id: E-P5-003
    key_assumption_under_attack: "validation 减少幻觉"
    possible_counterexample: |
      任何同质多 agent + 不准确 validation 机制都可能导致
      "all agents converge on wrong answer"。
    challenge_strength: major
    could_change_conclusion: yes

  - claim_id: C-007
    original_claim: "cost-effective 替代模型 retraining"
    strongest_counter_argument: |
      6× 计算成本。同期多 agent 推理成本分析：
      - 3 agents × 2 rounds = 6× 单 agent 推理 token
      - 加 context length penalty 可能达 9×
      - 与 GPT-3.5 fine-tuning 一次成本相比，
        推理成本随调用次数线性增长
      "Cost-effective" 完全未经量化。
    counter_evidence_id: E-P5-004
    key_assumption_under_attack: "成本对比成立"
    possible_counterexample: |
      10 万次推理调用下，6× 推理成本可能超过 GPT-3.5 fine-tuning 一次成本
    challenge_strength: major
    could_change_conclusion: yes

  - claim_id: C-008
    original_claim: "减少 human intervention 依赖"
    strongest_counter_argument: |
      反向：多 agent 实际上增加了对 human-designed personas 的依赖。
      CoT prompting 的"explicit human guidance" 是一次性 prompt 工程；
      多 agent 需要为每个 persona 设计 system prompt、定义 role 边界、
      设计 validation 协议。这些都是 human intervention，
      只是从"运行时的 prompt"转移到"设计时的 system prompt"。
    counter_evidence_id: E-P5-005
    key_assumption_under_attack: "原方法（CoT）需要 explicit human guidance"
    possible_counterexample: |
      CoT 可以用 few-shot examples 自动化，无需 human-in-the-loop per query
    challenge_strength: moderate
    could_change_conclusion: yes

competing_explanations:
  - alternative_explanation: "提升是'更多推理 token'的效应，不是 multi-agent 架构的效应"
    why_plausible: |
      Pham et al. 2024 已证：单 LLM 多次采样的简单 ensemble
      可在 GSM8K 上达到多 agent 同等效果。
      同等 token 预算下，self-consistency 应作为最强 baseline。
    article_addresses_it: no
    evidence_needed_to_distinguish: |
      compute-matched 对照实验
  - alternative_explanation: "persona 本身无效，'不同 system prompt'才是 active ingredient"
    why_plausible: |
      同 LLM + 不同 system prompt 即使没有 role-playing 概念
      也能产出不同输出（temperature + 不同的 system prompt）。
    article_addresses_it: no
    evidence_needed_to_distinguish: "消融实验：persona vs no-persona multi-agent"
  - alternative_explanation: "Teacher/Student 角色是装饰性命名，实际是更详细的 system prompt"
    why_plausible: |
      "Teacher" 在教育语境中代表能评估学生，但本文 Teacher
      可能只是"更系统的 CoT prompt"，无评估机制
    article_addresses_it: no
    evidence_needed_to_distinguish: "具体 Teacher 的 prompt 内容 + 输出是否包含对 Student 的反馈"

