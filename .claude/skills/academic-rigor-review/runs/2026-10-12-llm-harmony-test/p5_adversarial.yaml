    description: |
      【P5 独立发现】"减少 human intervention" 实际是把 human work
      从运行时移到设计时：每个 persona 需要人工设计 system prompt。
      P3 提到 C-008 假设原方法需要 explicit human guidance 但未反驳；
      P4 提到方法适当性但未深入 human intervention 的转移。
    severity: P3
    why_previous_reviewers_missed: "human intervention 转移是隐性成本，不在 surface claim 表面"

conclusion_sensitivity:
  - assumption_or_evidence: "如果 compute-matched self-consistency 接近 65%"
    if_changed_conclusion: |
      multi-agent 架构无独立价值，C-001 因果失效，
      整个方法的创新性主张崩塌。
  - assumption_or_evidence: "如果 baseline 55% 实际是 single-agent CoT（误标）"
    if_changed_conclusion: |
      提升从 +10pp 变为 +15pp（multi-agent vs single-agent），
      与同期 MAD 工作（+8.7pp）相当但仍非显著。
  - assumption_or_evidence: "如果 collective delusion 率 > 30%"
    if_changed_conclusion: |
      C-003 "减少幻觉" 主张反向成立，
      需重新评估方法的安全性。
  - assumption_or_evidence: "如果 Teacher/Student role 没有实际评估机制"
    if_changed_conclusion: |
      "role-playing" 是装饰性命名，
      实际是"不同 system prompt + 多 pass CoT"，
      创新性进一步降低。

minimal_critical_verifications:
  - id: V-P5-001
    verification_target: "compute-matched self-consistency 复现"
    expected_outcome: |
      如果 self-consistency 在 6× token 预算下达 75%+，
      则本文 65% 无独立价值
    impact_on_conclusion: "可能推翻 C-001 因果链"
  - id: V-P5-002
    verification_target: "persona 消融实验（persona vs no-persona multi-agent）"
    expected_outcome: |
      如果 no-persona multi-agent ≈ with-persona，
      则 persona 是装饰性命名
    impact_on_conclusion: "降低创新性主张"
  - id: V-P5-003
    verification_target: "失败案例的 collective delusion 比例"
    expected_outcome: |
      如果失败案例中 > 30% 属于 collective delusion，
      则 C-003 主张反向
    impact_on_conclusion: "重评安全性和有效性"

