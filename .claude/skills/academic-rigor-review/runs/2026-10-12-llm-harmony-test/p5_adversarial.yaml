  - id: D-304-P5
    related_claim_id: C-001
    evidence_id: E-P5-006
    textual_position: "全文"
    description: |
      【P5 独立发现】论文长度仅 4 页，单一作者，疑似 workshop position paper
      而非 full venue paper。这种短论文通常：
      1) 缺乏完整实验（无显著性、无消融）
      2) 缺乏完整相关工作
      3) 缺乏完整 limitations
      P2-P4 默认按 full paper 标准评估，未考虑 venue/format 因素。
    severity: P2
    why_previous_reviewers_missed: "P2-P4 按 full paper 标准要求 P0 修复等，venue-aware 调整未做"
  - id: D-305-P5
    related_claim_id: C-008
    evidence_id: E-P5-005
