supplementary_verification_plan:
  - id: V-201
    question_to_verify: "提升的因果归因——是 multi-agent 架构还是更多推理 token？"
    competing_explanations:
      - "multi-agent 架构本身带来提升"
      - "更多推理 token（self-consistency）带来提升"
      - "特定 prompt 模板带来提升"
    recommended_experiment: |
      在相同推理 token 预算下对比：
      1) single-agent greedy
      2) single-agent self-consistency (k samples)
      3) 本文 multi-agent
    controls_needed: ["相同模型", "相同 prompt 模板核心部分", "相同总推理 token"]
    observation_metrics: ["准确率", "提升的边际收益 per token"]
    decision_rule: |
      如果 self-consistency ≈ multi-agent，则 multi-agent 架构无独立价值
      如果 self-consistency < multi-agent，则 multi-agent 架构有独立价值
  - id: V-202
    question_to_verify: "inter-agent validation 是否真的减少幻觉？"
    competing_explanations:
      - "validation 机制独立贡献"
      - "persona 本身（无需 validation）带来提升"
      - "role-playing prompting 本身带来提升"
    recommended_experiment: |
      消融实验：
      1) multi-agent + validation + persona（完整）
      2) multi-agent + validation, no persona
      3) multi-agent, no validation, persona
      4) single-agent + persona prompting only
    controls_needed: ["相同模型", "相同 CoT prompt", "相同任务"]
    observation_metrics: ["准确率", "hallucination rate (FActScore)", "agent agreement rate"]
    decision_rule: |
      如果 persona alone ≈ multi-agent，则 persona 是 active ingredient
      如果 validation 单独无效果，则 validation 声明失效
      如果 agent agreement > 80%，警惕 collective delusion

