narrative_summary: |
  本文是一份工程方法论设计文档，提出用 7 个 Prompt（P1-P7）协同完成学术严谨性评价。
  核心主张是"拆分 + 标准化 + 可追溯"，关键设计包括 P5 独立视角、P6 P0 否决、P7 影响范围重跑。
  文章类型为工程方法论（无对照实验、无统计数据），主要论证方式是规范性主张 + 设计原则列举 + 失败模式约束。
  主要不确定点：7 个任务的完备性、P5 输入边界、verdict 边界条件、影响范围判断算法。
