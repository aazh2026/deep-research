# P1 Output: docs/design.md 研究对象模型
# Generated by: orchestrator (smoke test)
# Date: 2026-10-12
# Article: docs/design.md（学术严谨性评价的 7-Prompt 工作流设计）

artifact_type: p1_object_model
version: 1.0

research_object_overview:
  article_type: engineering_methodology
  research_questions:
    - "如何把'主观学术评价'拆成可追溯的工件流？"
    - "7 个 Prompt 的设计原则是什么？"
    - "P2-P4 为何可并行？P5 为何要独立？P6 为何不能简单平均？"
    - "P7 修订后应触发哪些 P 任务重跑？"
  research_goals:
    - "提出一个 7-Prompt 多 Agent 协同的学术严谨性评价工作流"
    - "为每个 Prompt 定义输入、执行规则、输出格式、约束"
    - "通过统一 ID（C-/E-/D-/V-/DIM-）实现跨任务可追溯"
  core_concepts:
    - name: 学术严谨性评价公共规则
      definition: 10 条基本原则 + 5 类状态标签 + 4 级缺陷等级的统一评审基线
    - name: 统一 ID 规则
      definition: C-NNN（claim）/ E-NNN（evidence）/ D-NNN（defect）/ V-NNN（verification）/ DIM-NN（dimension）跨任务引用
    - name: 反方独立视角
      definition: P5 只看 P1 + article，不读 P2-P4 判断，避免被同化
    - name: P0 否决性缺陷
      definition: 足以使核心结论失去成立基础的缺陷，强制 verdict 降级
    - name: 影响范围触发的 P 重跑
      definition: P7 修订后只重跑被修改内容涉及的 P 任务，不全量重跑
  research_method: 经验性方法论设计（基于对学术评审流程的结构化抽象，无对照实验）
  declared_contributions:
    - "7-Prompt（P1-P7）分阶段工作流：解析 → 文献核查 → 论证审查 → 方法审查 → 反方挑战 → 综合评审 → 修订复评"
    - "10 条公共规则 + 5 类状态标签 + 4 级缺陷等级的统一评价标准"
    - "统一 ID 与跨任务追溯机制"
    - "P5 独立反方视角设计"
    - "P0 否决性缺陷的硬规则"
    - "P7 影响范围触发的增量重跑"

claims:
  - id: C-001
    text: 应该把学术严谨性评价拆成一组标准化输出件协同工作的 Prompt，而不是一个超长 Prompt 让 Agent 一次性完成
    position: "第一段"
    type: normative
    importance: core
    author_support: "设计原则段落"
    implicit_assumptions:
      - "复杂任务拆分会比单 Prompt 一次性完成效果更好"
      - "Subagent 之间可以通过结构化工件可靠通信"
    intended_scope: "学术严谨性评价任务"

  - id: C-002
    text: 每个 Prompt 应只负责一个明确的研究任务，有独立输入、明确执行规则、结构化输出和质量门禁；下游任务只消费上游产物
    position: "第二段"
    type: normative
    importance: core
    author_support: "Design 原则段落"
    implicit_assumptions:
      - "任务边界可被清晰划分"
      - "下游 prompt 不会被上游未声明的隐含信息影响"
    intended_scope: "所有 P 任务"

  - id: C-003
    text: 7 个 Prompt（P1-P7）覆盖学术严谨性评价的完整流程
    position: "第二节 一"
    type: declarative
    importance: core
    author_support: "P1-P7 各小节列表"
    implicit_assumptions:
      - "7 个任务已经穷尽学术严谨性评价的关键环节"
      - "不存在被遗漏的环节（如数据可获得性审查、利益冲突审查、作者资质审查等）"
    intended_scope: "学术论文、技术研究报告、Agent 架构模式研究、工程方法论"

  - id: C-004
    text: P2-P5 可在 P1 完成后并行执行
    position: "第二节末尾段落"
    type: declarative
    importance: important
    author_support: "P2-P5 各小节描述"
    implicit_assumptions:
      - "P2、P3、P4 之间没有信息依赖"
      - "P5 不需要 P2-P4 的输出就能独立挑战"
    intended_scope: "P1 完成后"

  - id: C-005
    text: 如果没有联网检索能力、原文附件或实验环境，相关 Prompt 只能标记"待核实"或"无法验证"，不能把推测当作已完成的核查
    position: "第二节末尾边界说明段"
    type: normative
    importance: important
    author_support: "边界说明段落"
    implicit_assumptions:
      - "作者和读者都同意这一边界"
    intended_scope: "所有依赖外部信息的 P 任务"

  - id: C-006
    text: 10 条公共规则（证据优先、区分事实与判断、不虚构证据等）是评价标准基线
    position: "第二节 二"
    type: declarative
    importance: core
    author_support: "10 条列举"
    implicit_assumptions:
      - "10 条已穷尽"
      - "10 条之间无矛盾"
    intended_scope: "所有 P 任务"

  - id: C-007
    text: 5 类状态标签（已支持/部分支持/待验证/被反驳/不适用）和 4 级缺陷等级（P0-P3）应统一用于所有 P 任务
    position: "第二节 二"
    type: declarative
    importance: important
    author_support: "统一状态标签和缺陷等级段落"
    implicit_assumptions:
      - "5 类状态足够区分所有情况"
      - "P0-P3 等级阈值有共识"
    intended_scope: "所有 P 任务"

  - id: C-008
    text: P5 反方挑战应独立构造反方论证，不重复 P2-P4 的评价
    position: "P5 任务描述首段"
    type: normative
    importance: core
    author_support: "P5 段首强调"
    implicit_assumptions:
      - "P5 具备独立发现问题的能力"
      - "P2-P4 可能漏掉关键问题"
    intended_scope: "P5 任务"

  - id: C-009
    text: P6 不能把 P2-P5 各维度分数简单求平均代替综合判断
    position: "P6 任务描述"
    type: normative
    importance: core
    author_support: "P6 强制约束第一条"
    implicit_assumptions:
      - "维度之间存在不可线性组合的关系"
    intended_scope: "P6 综合判断"

  - id: C-010
    text: 存在 P0 缺陷时，无论其他维度分数多高，verdict 必须降级为"因关键缺陷不成立"或"证据不足"
    position: "P6 任务描述强制约束"
    type: normative
    importance: core
    author_support: "P6 强制约束第二条"
    implicit_assumptions:
      - "P0 缺陷确实足以否定核心结论"
      - "verdict 是可枚举的离散量"
    intended_scope: "P6 verdict 生成"

  - id: C-011
    text: P6 的最终 verdict 必须是 6 种之一
    position: "P6 输出格式 F"
    type: declarative
    importance: important
    author_support: "P6 输出格式 F 列表"
    implicit_assumptions:
      - "6 种 verdict 已穷尽所有合法结论"
    intended_scope: "P6 输出"

  - id: C-012
    text: P7 修订后应根据修改影响范围触发相关 P 重跑，不全量重跑
    position: "P7 影响范围触发的 P 重跑段落"
    type: declarative
    importance: important
    author_support: "P7 Step 8 表格"
    implicit_assumptions:
      - "修改的影响范围可被准确判断"
    intended_scope: "P7 修订后"

  - id: C-013
    text: 不应将搜索不到等同于不存在；不应将引用数量等同于理论充分性
    position: "P2 约束段"
    type: normative
    importance: minor
    author_support: "P2 约束"
    implicit_assumptions: []
    intended_scope: "P2 文献核查"

  - id: C-014
    text: 不得将缺少证据直接判定为结论错误；不得仅凭表达不清认定推理错误
    position: "P3 约束段"
    type: normative
    importance: minor
    author_support: "P3 约束"
    implicit_assumptions: []
    intended_scope: "P3 主张审查"

  - id: C-015
    text: 不得仅因论文没有公开代码就直接判定其结论无效；不得将作者未报告某项控制措施直接等同于确定没有控制
    position: "P4 约束段"
    type: normative
    importance: minor
    author_support: "P4 约束"
    implicit_assumptions: []
    intended_scope: "P4 方法审查"

