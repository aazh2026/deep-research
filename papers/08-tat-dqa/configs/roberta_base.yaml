# MHST RoBERTa-base 训练配置

experiment: roberta_base_mhst_subset
seed: 42

model:
  backbone: roberta-base
  hidden_size: 768
  max_length: 512
  dropout: 0.1

data:
  hf_dataset: next-tat/TAT-DQA
  cache_dir: ./cache
  local_dir: ./data_local
  train_size: 1500
  dev_size: 300
  test_size: 500
  max_length: 512
  question_max_length: 64
  context_max_length: 448
  stratify_by_type: true

training:
  epochs: 3
  batch_size: 4
  grad_accum: 4            # 等效 batch=16
  backbone_lr: 2.0e-5
  head_lr: 1.0e-4
  warmup_ratio: 0.06
  weight_decay: 0.01
  grad_clip: 1.0
  early_stop_patience: 2
  log_every: 10
  save_dir: ./outputs/checkpoints
  metrics_path: ./outputs/metrics.json

loss_weights:
  type: 1.0
  span: 1.0
  tag: 1.0
  arith_op: 1.0
  arith_count: 0.5
  scale: 0.5

eval:
  batch_size: 4
  checkpoint: ./outputs/checkpoints/best.pt